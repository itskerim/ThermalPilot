<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
  <title>Thermal Pilot — Fan</title>
  <g id="fan" transform="translate(12,12)">
    <!-- Blade: sweeps left as it extends upward, outer tip curves right -->
    <!-- Rotate ×4 at 90° to form a 4-blade spinning fan -->
    <path id="blade-1" d="M0 0 C-0.8-1.8-1.2-4 0-6 C1-7.5 3.5-7 4-4.5 C3.5-2 1.8-0.5 0 0Z"/>
    <path id="blade-2" d="M0 0 C-0.8-1.8-1.2-4 0-6 C1-7.5 3.5-7 4-4.5 C3.5-2 1.8-0.5 0 0Z" transform="rotate(90)"/>
    <path id="blade-3" d="M0 0 C-0.8-1.8-1.2-4 0-6 C1-7.5 3.5-7 4-4.5 C3.5-2 1.8-0.5 0 0Z" transform="rotate(180)"/>
    <path id="blade-4" d="M0 0 C-0.8-1.8-1.2-4 0-6 C1-7.5 3.5-7 4-4.5 C3.5-2 1.8-0.5 0 0Z" transform="rotate(270)"/>
    <circle id="hub" r="1.75"/>
  </g>
</svg>
